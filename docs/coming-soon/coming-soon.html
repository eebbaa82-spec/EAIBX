<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Investopia | Coming soon</title>
<meta name="description" content="Investopia, a platform by Erudite Africa Investments PLC, is coming soon.">
<style>
  :root { --brand: #0f5242; --brand-dark: #0a3329; --gold: #e2b04a; --text: #eef7f3; --muted: #a9d8c4; }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body {
    min-height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 48px 16px; text-align: center; color: var(--text);
    background: radial-gradient(circle at 50% 0%, var(--brand) 0%, var(--brand-dark) 70%);
    font-family: "Segoe UI", system-ui, -apple-system, Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  .brand { display: inline-flex; align-items: center; gap: 12px; font-size: 1.5rem; font-weight: 700; letter-spacing: 0.01em; }
  .mark { display: inline-grid; place-items: center; width: 48px; height: 48px; border-radius: 12px; background: var(--gold); color: var(--brand-dark); font-weight: 800; font-size: 1.1rem; }
  h1 { margin-top: 48px; font-size: clamp(2rem, 6vw, 3.5rem); line-height: 1.1; font-weight: 700; }
  h1 span { color: var(--gold); }
  .tagline { margin-top: 20px; font-size: 1.15rem; color: var(--muted); }
  .operator { margin-top: 8px; font-size: 0.95rem; color: var(--muted); }
  form { margin: 40px auto 0; width: 100%; max-width: 440px; }
  form p { font-size: 1rem; margin-bottom: 12px; }
  .row { display: flex; gap: 8px; }
  input[type=email] { flex: 1; min-width: 0; padding: 12px 14px; border-radius: 10px; border: 1px solid rgba(255,255,255,.25); background: rgba(255,255,255,.08); color: var(--text); font-size: 1rem; }
  input[type=email]::placeholder { color: var(--muted); }
  button { padding: 12px 18px; border: 0; border-radius: 10px; background: var(--gold); color: var(--brand-dark); font-weight: 700; font-size: 1rem; cursor: pointer; }
  button:disabled { opacity: .6; }
  .hp { position: absolute; left: -9999px; }
  #status { margin-top: 12px; min-height: 1.4em; font-size: .95rem; color: var(--gold); }
  .contact { margin-top: 32px; font-size: 0.95rem; }
  .contact a { color: var(--gold); text-decoration: none; border-bottom: 1px solid currentColor; }
  footer { margin-top: 64px; font-size: 0.8rem; color: var(--muted); }
</style>
</head>
<body>
  <div class="brand"><span class="mark">IN</span>Investopia</div>
  <h1>Something exciting is <span>coming soon</span></h1>
  <p class="tagline">Powering Smarter Business Decisions.</p>
  <p class="operator">A platform by Erudite Africa Investments PLC.</p>
  <form id="waitlist" action="/api/submit.php" method="post">
    <p>Be the first to know when we open.</p>
    <input type="hidden" name="form" value="waitlist">
    <label class="hp" aria-hidden="true">Leave this empty <input type="text" name="website" tabindex="-1" autocomplete="off"></label>
    <div class="row">
      <label for="wl-email" class="hp">Email address</label>
      <input id="wl-email" type="email" name="email" required placeholder="you@example.com">
      <button type="submit">Notify me</button>
    </div>
    <p id="status" role="status"></p>
  </form>
  <p class="contact">Questions in the meantime? <a href="mailto:investopia@eruditeafrica.com">investopia@eruditeafrica.com</a></p>
  <footer>&copy; 2026 Erudite Africa Investments PLC. Addis Ababa, Ethiopia.</footer>
<script>
  document.getElementById("waitlist").addEventListener("submit", async function (e) {
    e.preventDefault();
    var form = e.currentTarget, status = document.getElementById("status"), button = form.querySelector("button");
    button.disabled = true;
    status.textContent = "Sending...";
    try {
      var res = await fetch(form.action, { method: "POST", body: new FormData(form) });
      var body = await res.json();
      if (!res.ok || !body.ok) throw new Error();
      form.querySelector(".row").remove();
      status.textContent = "Thank you. We'll email you when Investopia opens.";
    } catch (err) {
      button.disabled = false;
      status.textContent = "Sorry, that didn't go through. Please try again.";
    }
  });
</script>
</body>
</html>

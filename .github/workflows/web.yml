name: Web

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
    paths: ["apps/web/**", ".github/workflows/web.yml"]
  push:
    branches: [main]
    paths: ["apps/web/**", ".github/workflows/web.yml"]

jobs:
  build:
    if: github.event_name == 'push' || github.event.action != 'closed'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: apps/web/out

  # Deploys to Azure Static Web Apps once the AZURE_STATIC_WEB_APPS_API_TOKEN
  # repository secret exists. Pushes to main update the preview site; each pull
  # request gets its own temporary preview URL.
  deploy:
    needs: build
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      HAS_TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN != '' }}
    steps:
      - uses: actions/download-artifact@v4
        if: env.HAS_TOKEN == 'true'
        with:
          name: site
          path: out
      - uses: Azure/static-web-apps-deploy@v1
        if: env.HAS_TOKEN == 'true'
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: out
          skip_app_build: true
          skip_api_build: true
      - if: env.HAS_TOKEN != 'true'
        run: echo "AZURE_STATIC_WEB_APPS_API_TOKEN is not set yet, so nothing was deployed."

  close-preview:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    env:
      HAS_TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN != '' }}
    steps:
      - uses: Azure/static-web-apps-deploy@v1
        if: env.HAS_TOKEN == 'true'
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: close
          app_location: /
